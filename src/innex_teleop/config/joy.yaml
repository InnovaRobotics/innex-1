game_controller_node:
  ros__parameters:
    deadzone: 0.1
    autorepeat_rate: 20.0

teleop_twist_joy_node:
  ros__parameters:
    require_enable_button: true
    enable_button: 9  # Left shoulder button
    enable_turbo_button: -1  # No turbo button
    axis_linear:
      x: 1  # Left stick, up and down
    scale_linear:
      x: 0.25  # m/s at full stick
    axis_angular:
      yaw: 2  # Right stick, left and right
    scale_angular:
      yaw: 0.4  # rad/s at full stick
    publish_stamped_twist: true
    frame: base_link
