[platformio]
default_envs = native

[env:native]
platform = platformio/native@1.2.1
test_framework = unity
build_flags = -std=c++17 -Wall -Wextra -Werror

[env:teensy41]
platform = platformio/teensy@5.0.0
platform_packages =
    platformio/framework-arduinoteensy@1.159.0
    platformio/toolchain-gccarmnoneeabi-teensy@1.110301.0
    platformio/tool-teensy@1.162.0
board = teensy41
framework = arduino
build_flags = -D USB_SERIAL
test_ignore = test_drive_core
