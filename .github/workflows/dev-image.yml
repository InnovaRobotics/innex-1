name: Dev image

on:
  push:
    branches: [main]
    paths:
      - ".devcontainer/Dockerfile"
      - ".github/workflows/dev-image.yml"
  pull_request:
    paths:
      - ".devcontainer/Dockerfile"
      - ".github/workflows/dev-image.yml"
  workflow_dispatch:
    inputs:
      ros_snapshot:
        description: "snapshots.ros.org date (YYYY-MM-DD) or empty for live"
        required: false
        default: ""

permissions:
  contents: read
  packages: write

concurrency:
  group: dev-image-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-22.04
            tag: amd64
          - platform: linux/arm64
            runner: ubuntu-22.04-arm
            tag: arm64
    steps:
      - uses: actions/checkout@v4
      - name: Image name
        id: meta
        run: echo "image=ghcr.io/$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')/innex-1-dev" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: .devcontainer/Dockerfile
          platforms: ${{ matrix.platform }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.image }}:${{ matrix.tag }}
          build-args: |
            ROS_SNAPSHOT=${{ inputs.ros_snapshot }}
          cache-from: type=gha,scope=${{ matrix.tag }}
          cache-to: type=gha,scope=${{ matrix.tag }},mode=max

  manifest:
    name: Multi-arch manifest
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-22.04
    steps:
      - name: Image name
        id: meta
        run: echo "image=ghcr.io/$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')/innex-1-dev" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Create and push manifest
        run: |
          docker buildx imagetools create \
            -t ${{ steps.meta.outputs.image }}:latest \
            -t ${{ steps.meta.outputs.image }}:${{ github.sha }} \
            ${{ steps.meta.outputs.image }}:amd64 \
            ${{ steps.meta.outputs.image }}:arm64
